<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>급여관리 계산기</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

body{
    background:#f3f6fa;
    font-family:'Malgun Gothic',sans-serif;
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 3px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#2c3e50;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#0078d7;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005fb8;
}

.result{
    margin-top:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:8px 0;
}

.summary{
    background:#eef6ff;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

</style>
</head>
<body>

<div class="container">

<h1>급여관리 계산기</h1>

<label>회사명</label>
<input id="company" value="하우징파트너스정">

<label>구분</label>
<select id="workerType">
    <option value="ceo">대표이사</option>
    <option value="employee">직원</option>
</select>

<label>생년월일</label>
<input id="birthDate" type="date">

<label>지급월</label>
<input id="month" placeholder="2026-10">

<label>성명</label>
<input id="name" placeholder="홍길동">

<label>기본급</label>
<input id="salary" type="number" value="3000000">

<label>식대</label>
<input id="meal" type="number" value="200000">

<button onclick="calculate()">
급여 계산
</button>

<button onclick="downloadCSV()">
CSV 다운로드
</button>

<button onclick="downloadPDF()">
급여명세서 PDF 다운로드
</button>

<div id="result" class="result">
계산 결과가 표시됩니다.
</div>

</div>

<script>

const RATE = {
    pension:0.0475,
    health:0.03595,
    care:0.1314,
    employment:0.009
};

let payroll = null;

function formatMonth(month){

    if(!month) return "";

    const parts = month.split("-");

    return `${parts[0]}년 ${parseInt(parts[1])}월`;
}
    function getAgeAtMonth(birthDate, payMonth){

    if(!birthDate || !payMonth) return 0;

    const birth = new Date(birthDate);
    const target = new Date(payMonth + "-01");

    let age =
        target.getFullYear() -
        birth.getFullYear();

    if (
        target.getMonth() < birth.getMonth() ||
        (
            target.getMonth() === birth.getMonth() &&
            target.getDate() < birth.getDate()
        )
    ){
        age--;
    }

    return age;
}

function calculate(){

    const company =
      document.getElementById("company").value;

    const workerType =
      document.getElementById("workerType").value;
    const birthDate =
  document.getElementById("birthDate").value;

const month =
  document.getElementById("month").value;

const age =
  getAgeAtMonth(birthDate, month);
    const name =
      document.getElementById("name").value;

    const salary =
      Number(document.getElementById("salary").value);

    const meal =
      Number(document.getElementById("meal").value);

    const total =
      salary + meal;

    const usePension =
      workerType === "employee" && age < 60;

    const useEmployment =
      workerType === "employee" && age < 65;

    const pension =
      usePension
      ? Math.round(salary * RATE.pension)
      : 0;

    const health =
      Math.round(salary * RATE.health);

    const care =
      Math.round(health * RATE.care);

    const employment =
      useEmployment
      ? Math.round(salary * RATE.employment)
      : 0;

    const deduction =
      pension +
      health +
      care +
      employment;

    const net =
      total - deduction;

    payroll = {
        company,
        workerType,
        birthDate,
        age,
        month,
        name,
        salary,
        meal,
        total,
        pension,
        health,
        care,
        employment,
        deduction,
        net
    };

    document.getElementById("result").innerHTML = `

<div id="payrollSlip"
style="
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.1);
">

<h2 style="text-align:center;">
${company}
</h2>

<h3 style="text-align:center;">
급여명세서
</h3>

<hr>

<p><strong>지급월 :</strong> ${formatMonth(month)}</p>
<p><strong>성명 :</strong> ${name}</p>
<p><strong>구분 :</strong> ${workerType === "ceo" ? "대표이사" : "직원"}</p>
<p><strong>만 나이 :</strong> ${age}세</p>

<div class="summary">

국민연금 :
${pension === 0 ? "제외" : "적용"}

<br>

고용보험 :
${employment === 0 ? "제외" : "적용"}

</div>

<hr>

<table>

<tr>
<td>기본급</td>
<td align="right">${salary.toLocaleString()}원</td>
</tr>

<tr>
<td>식대</td>
<td align="right">${meal.toLocaleString()}원</td>
</tr>

<tr>
<td><strong>총지급액</strong></td>
<td align="right">
<strong>${total.toLocaleString()}원</strong>
</td>
</tr>

</table>

<hr>

<table>

<tr>
<td>국민연금</td>
<td align="right">${pension.toLocaleString()}원</td>
</tr>

<tr>
<td>건강보험</td>
<td align="right">${health.toLocaleString()}원</td>
</tr>

<tr>
<td>장기요양보험</td>
<td align="right">${care.toLocaleString()}원</td>
</tr>

<tr>
<td>고용보험</td>
<td align="right">${employment.toLocaleString()}원</td>
</tr>

<tr>
<td><strong>공제합계</strong></td>
<td align="right">
<strong>${deduction.toLocaleString()}원</strong>
</td>
</tr>

</table>

<hr>

<h2 style="
text-align:right;
color:#0078d7;
">
실수령액 :
${net.toLocaleString()}원
</h2>

</div>
`;
}

function downloadCSV(){

    if(!payroll){
        alert("먼저 계산하세요.");
        return;
    }

    const csv =
`회사명,지급월,성명,구분,나이,기본급,식대,총지급액,국민연금,건강보험,장기요양보험,고용보험,공제합계,실수령액
${payroll.company},${formatMonth(payroll.month)},${payroll.name},${payroll.workerType},${payroll.age},${payroll.salary},${payroll.meal},${payroll.total},${payroll.pension},${payroll.health},${payroll.care},${payroll.employment},${payroll.deduction},${payroll.net}`;

    const blob =
      new Blob(
       ["\uFEFF"+csv],
       {type:"text/csv;charset=utf-8;"}
      );

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      `${payroll.company}_${payroll.name}_급여대장.csv`;

    link.click();
}

async function downloadPDF(){

    if(!payroll){
        alert("먼저 계산하세요.");
        return;
    }

    const target =
      document.getElementById("payrollSlip");

    const canvas =
      await html2canvas(target);

    const imgData =
      canvas.toDataURL("image/png");

    const { jsPDF } =
      window.jspdf;

    const pdf =
      new jsPDF("p","mm","a4");

    const width = 190;

    const height =
      canvas.height *
      width /
      canvas.width;

    pdf.addImage(
      imgData,
      "PNG",
      10,
      10,
      width,
      height
    );

    pdf.save(
      `${payroll.company}_${payroll.name}_급여명세서.pdf`
    );
}

</script>

</body>
</html>
