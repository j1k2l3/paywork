<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>급여관리</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:30px auto;
    padding:20px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:20px;
    background:#f5f5f5;
    border-radius:10px;
}
</style>
</head>
<body>

<h1>급여관리 시스템</h1>

<label>지급월</label>
<input id="month" placeholder="2026-10">

<label>성명</label>
<input id="name" placeholder="홍길동">

<label>기본급</label>
<input id="salary" type="number" value="3000000">

<label>식대</label>
<input id="meal" type="number" value="200000">

<button onclick="calculate()">
급여 계산
</button>

<button onclick="downloadCSV()">
CSV 다운로드
</button>

<button onclick="downloadPDF()">
PDF 다운로드
</button>

<div id="result" class="result">
계산 결과가 표시됩니다.
</div>

<script>

const RATE = {
    pension: 0.0475,
    health: 0.03595,
    care: 0.1314,
    employment: 0.009
};

let payroll = null;

function calculate(){

    const month =
      document.getElementById("month").value;

    const name =
      document.getElementById("name").value;

    const salary =
      Number(document.getElementById("salary").value);

    const meal =
      Number(document.getElementById("meal").value);

    const total =
      salary + meal;

    const pension =
      Math.round(salary * RATE.pension);

    const health =
      Math.round(salary * RATE.health);

    const care =
      Math.round(health * RATE.care);

    const employment =
      Math.round(salary * RATE.employment);

    const deduction =
      pension +
      health +
      care +
      employment;

    const net =
      total - deduction;

    payroll = {
      month,
      name,
      salary,
      meal,
      total,
      pension,
      health,
      care,
      employment,
      deduction,
      net
    };

    document.getElementById("result").innerHTML = `
      <h3>급여 계산 결과</h3>

      지급월 :
      ${month}<br>

      성명 :
      ${name}<br><br>

      기본급 :
      ${salary.toLocaleString()} 원<br>

      식대 :
      ${meal.toLocaleString()} 원<br><br>

      총지급액 :
      ${total.toLocaleString()} 원<br><br>

      국민연금 :
      ${pension.toLocaleString()} 원<br>

      건강보험 :
      ${health.toLocaleString()} 원<br>

      장기요양보험 :
      ${care.toLocaleString()} 원<br>

      고용보험 :
      ${employment.toLocaleString()} 원<br><br>

      공제합계 :
      ${deduction.toLocaleString()} 원<br><br>

      <b style="font-size:20px;color:blue;">
      실수령액 :
      ${net.toLocaleString()} 원
      </b>
    `;
}

function downloadCSV(){

    if(!payroll || !payroll.name){
        alert("먼저 계산하세요.");
        return;
    }

    const csv =
`지급월,성명,기본급,식대,총지급액,국민연금,건강보험,장기요양보험,고용보험,공제합계,실수령액
${payroll.month},${payroll.name},${payroll.salary},${payroll.meal},${payroll.total},${payroll.pension},${payroll.health},${payroll.care},${payroll.employment},${payroll.deduction},${payroll.net}`;

    const blob =
      new Blob(
        ["\uFEFF" + csv],
        {type:"text/csv;charset=utf-8;"}
      );

    const link =
      document.createElement("a");

    link.href =
      URL.createObjectURL(blob);

    link.download =
      `${payroll.month}_${payroll.name}_급여대장.csv`;

    link.click();
}

function downloadPDF(){

    if(!payroll || !payroll.name){
        alert("먼저 계산하세요.");
        return;
    }

    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF();

    doc.setFontSize(18);

    doc.text(
      "Payroll Statement",
      20,
      20
    );

    doc.setFontSize(11);

    let y = 40;

    doc.text(
      `Month : ${payroll.month}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Name : ${payroll.name}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Salary : ${payroll.salary.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Meal : ${payroll.meal.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Total : ${payroll.total.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Pension : ${payroll.pension.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Health : ${payroll.health.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Care : ${payroll.care.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Employment : ${payroll.employment.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Deduction : ${payroll.deduction.toLocaleString()}`,
      20,
      y
    );
    y += 10;

    doc.text(
      `Net Pay : ${payroll.net.toLocaleString()}`,
      20,
      y
    );

    doc.save(
      `${payroll.month}_${payroll.name}_급여명세서.pdf`
    );
}

</script>

</body>
</html>
